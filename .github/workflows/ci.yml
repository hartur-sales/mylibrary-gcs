name: CI - MyLibrary

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Backend
        run: |
          cd backend
          mvn verify --no-transfer-progress

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/mylibrary-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/mylibrary-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend/mylibrary-frontend
          npm run build